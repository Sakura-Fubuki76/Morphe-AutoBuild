name: Build Morphe patched apps

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "Optional direct YouTube APK/APKM/APKS/XAPK URL. Leave empty to auto-download from APKPure."
        required: false
        type: string
      reddit_url:
        description: "Optional direct Reddit APK/APKM/APKS/XAPK URL. Leave empty to auto-download from APKPure."
        required: false
        type: string
      twitter_url:
        description: "Optional direct X/Twitter APK/APKM/APKS/XAPK URL. Leave empty to auto-download from APKPure."
        required: false
        type: string
      prerelease:
        description: "Publish GitHub release as prerelease"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: write

concurrency:
  group: morphe-patched-apps
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PACKAGE_NAME: com.google.android.youtube
      REDDIT_PACKAGE_NAME: com.reddit.frontpage
      TWITTER_PACKAGE_NAME: com.twitter.android
      YOUTUBE_URL: ${{ inputs.youtube_url }}
      REDDIT_URL: ${{ inputs.reddit_url }}
      TWITTER_URL: ${{ inputs.twitter_url }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      ALIAS: ${{ secrets.ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --upgrade requests packaging

      - name: Install APK downloader dependencies
        run: pip install curl_cffi beautifulsoup4

      - name: Build apps
        run: bash scripts/build-morphe.sh

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-logs
          path: |
            build/*.txt
            build/*.log
          if-no-files-found: ignore

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          body_path: build/release-notes.md
          prerelease: ${{ inputs.prerelease }}
          files: |
            dist/YouTube-*.zip
            dist/Reddit-*.apk
            dist/X-*.apk

      - name: Commit update.json & changelog
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in dist/update.json dist/YouTube-changelog.md; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet || git commit -m "chore: update KSU module metadata [skip ci]"
          git push

      - name: Notify Telegram
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          REPO: ${{ github.repository }}
        run: python3 scripts/notify_telegram.py